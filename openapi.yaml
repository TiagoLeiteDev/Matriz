openapi: 3.1.0
info:
  title: Matriz API colaborativa
  version: 0.4.0
  description: 'Matriz colaborativa — contrato ativo. Exercício 3 implementa sessão/CSRF e consultas protegidas;
    Exercício 4 implementa CRUD de projetos, arquivo/restauro e pesquisa PESQ-01. As restantes operações
    estão planeadas e continuam bloqueadas. Ver x-implementation-status em cada operação. Sessão no servidor:
    60 minutos de inatividade, sem lembrar-me, sem persistência após reinício, revogada no logout. Cookie
    matriz_session HttpOnly/SameSite=Lax/Secure no perfil HTTPS de produção. CSRF obrigatório em operações
    de escrita, incluindo login/logout; token obtido por GET /sessao/csrf e novamente após autenticação/logout.
    Cabeçalho X-CSRF-Token. Uma escrita sem CSRF pode devolver 403 antes da verificação de autenticação.
    Listagens futuras não têm paginação definida nem ordem garantida. PATCH futuro conserva campos omitidos;
    null limpa apenas opcionais. Identidade do ator nunca vem do pedido. UUIDs são devolvidos como strings
    opacas. Pesquisa de projetos por parte do nome, ignorando maiúsculas e acentos, sem paginação e com
    q literal; filtro arquivado=false por defeito. Nome não vazio/não só espaços; descrição opcional;
    sem limites máximos de texto definidos. Não há exposição pública aprovada.'
security:
- Sessao: []
paths:
  /sessao/csrf:
    get:
      operationId: obterCsrf
      summary: Preparar protecao CSRF
      description: Pode criar sessão anónima. Devolve token CSRF mascarado associado à sessão; enviar
        em X-CSRF-Token e manter cookie. Obter novamente após login/rotação e logout. Não guardar em armazenamento
        persistente nem logs; respostas sem cache.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '500':
          $ref: '#/components/responses/500'
      security: []
      x-implementation-status: implemented
  /sessao:
    post:
      operationId: iniciarSessao
      summary: Iniciar sessao
      description: Autenticação local por email exato e BCrypt; mensagem genérica para email inexistente/palavra-passe
        errada. Validar CSRF e Origin quando presente. Rodar ID da sessão, apagar CSRF anterior e guardar
        explicitamente contexto no servidor. Devolver apenas perfil; nunca credenciais/hash. Sessão com
        60 minutos de inatividade, sem lembrar-me.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
          headers:
            Set-Cookie:
              description: Cookie matriz_session opaco; HttpOnly, SameSite e Secure em HTTPS. Valor gerado
                pelo servidor.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      x-implementation-status: implemented
    get:
      operationId: consultarSessao
      summary: Consultar utilizador autenticado
      description: Perfil da identidade da sessao, sem hashes.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      x-implementation-status: implemented
    delete:
      operationId: terminarSessao
      summary: Terminar sessao
      description: Exige sessão válida e CSRF atual. Invalida sessão no servidor, limpa contexto e expira
        cookie matriz_session. Cookie anterior deixa de autenticar. Obter novo CSRF para novo login; não
        repetir automaticamente escritas falhadas.
      responses:
        '204':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          headers:
            Set-Cookie:
              description: Expira cookie de sessao.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      x-implementation-status: implemented
  /projetos:
    get:
      operationId: listarProjetos
      summary: Listar e pesquisar projetos acessiveis
      description: 'Apenas proprietário ou colaborador atual. arquivado=false por defeito separa ativos/arquivo.
        PESQ-01: q procura parte do nome ignorando maiúsculas e acentos; vazio não restringe. %, _ e aspas
        são texto literal, sem wildcards. Sem paginação ou ordem garantida. Nunca devolver projetos alheios.'
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Projeto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: q
        in: query
        required: false
        description: Parte do nome, ignorando maiúsculas e acentos (PESQ-01); texto literal, vazio não
          restringe.
        schema:
          type: string
      - name: arquivado
        in: query
        required: false
        description: 'false (predefinido): ativos; true: arquivo. Apenas valores literais true/false.'
        schema:
          type: boolean
          default: false
      x-implementation-status: implemented
    post:
      operationId: criarProjeto
      summary: Criar projeto
      description: Proprietario inferido da sessao; arquivado=false. Nao aceitar proprietarioId do cliente.
      responses:
        '201':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
              example:
                id: 00000000-0000-4000-8000-000000000011
                nome: Demonstracao
                descricao: null
                arquivado: false
                proprietario:
                  id: 00000000-0000-4000-8000-000000000001
                  nome: Ana Demo
                  email: ana@example.test
                progresso:
                  totalTarefas: 0
                  tarefasConcluidas: 0
                  percentagem: 0
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarProjeto'
            example:
              nome: Demonstracao
      x-implementation-status: implemented
  /projetos/{projetoId}:
    parameters:
    - $ref: '#/components/parameters/ProjetoId'
    get:
      operationId: consultarProjeto
      summary: Consultar projeto
      description: Acesso atual exigido; pode consultar projeto arquivado em modo de leitura. Progresso
        calculado sobre todas as suas tarefas, sem efeito dos filtros da interface.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '400':
          $ref: '#/components/responses/400'
      x-implementation-status: implemented
    patch:
      operationId: atualizarProjeto
      summary: Editar, arquivar ou restaurar projeto
      description: 'Só proprietário. PATCH não vazio: campos omitidos conservam valor; null limpa apenas
        descricao. nome não vazio/não só espaços; descricao opcional sem máximo definido. arquivado=true
        arquiva, false restaura, sem apagar dependentes. Proprietário é imutável. Operação transacional
        com lock do projeto.'
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarProjeto'
      x-implementation-status: implemented
    delete:
      operationId: eliminarProjeto
      summary: Eliminar projeto e dependentes
      description: Só proprietário, com CSRF. UI exige confirmação explícita antes do pedido; cancelar
        não envia DELETE. Remover atomicamente projeto, tarefas, comentários, atribuições e colaborações;
        conservar contas, outros projetos e tarefas pessoais. Rollback integral em falha; 204 só após
        commit.
      responses:
        '204':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '400':
          $ref: '#/components/responses/400'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      x-implementation-status: implemented
  /projetos/{projetoId}/colaboradores:
    parameters:
    - $ref: '#/components/parameters/ProjetoId'
    get:
      operationId: listarColaboradores
      summary: Consultar colaboradores
      description: Exige acesso ao projeto; o proprietario esta representado no proprio projeto. Resposta
        sem credenciais.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Utilizador'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-implementation-status: planned
    post:
      operationId: adicionarColaborador
      summary: Adicionar colaborador existente
      description: So proprietario; identificar conta existente por email, sem registo publico. Nao duplicar
        colaboracao nem criar perfil global.
      responses:
        '201':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColaboradorRequest'
      x-implementation-status: planned
  /projetos/{projetoId}/colaboradores/{utilizadorId}:
    parameters:
    - $ref: '#/components/parameters/ProjetoId'
    - $ref: '#/components/parameters/UtilizadorId'
    delete:
      operationId: removerColaborador
      summary: Remover colaborador
      description: So proprietario. Remover colaboracao e atribuicoes agora inelegiveis na mesma operacao.
        Nao remover proprietario por esta rota nem apagar contas ou autoria de comentarios.
      responses:
        '204':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      x-implementation-status: planned
  /tarefas:
    get:
      operationId: listarTarefas
      summary: Listar tarefas autorizadas
      description: Projetos acessiveis nao arquivados e tarefas independentes do criador. Intersecao de
        filtros; projetoId+semProjeto=true ou prioridade+semPrioridade=true invalidos. Limites de prazo
        inclusivos excluem tarefas sem prazo; intervalo invertido=400. Lista/Kanban/calendario reutilizam
        dados; contagens nao se limitam a pagina visivel.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: q
        in: query
        required: false
        description: Parte do titulo, sem distinguir maiusculas; vazio nao restringe. Acentos pendentes.
        schema:
          type: string
      - name: projetoId
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Id'
      - name: semProjeto
        in: query
        required: false
        description: ''
        schema:
          type: boolean
          default: false
      - name: estado
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Estado'
      - name: prioridade
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Prioridade'
      - name: semPrioridade
        in: query
        required: false
        description: ''
        schema:
          type: boolean
          default: false
      - name: prazoDe
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date
      - name: prazoAte
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date
      x-implementation-status: planned
    post:
      operationId: criarTarefa
      summary: Criar tarefa
      description: Criador inferido da sessao. Projeto opcional; independente e privada do criador. Projeto
        preenchido exige acesso e nao arquivado. Estado omitido=Por Fazer. Prazo passado permitido.
      responses:
        '201':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
              example:
                id: 00000000-0000-4000-8000-000000000021
                titulo: Preparar dados
                descricao: null
                estado: Por Fazer
                prioridade: null
                prazo: null
                projetoId: 00000000-0000-4000-8000-000000000011
                criadorId: 00000000-0000-4000-8000-000000000001
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarTarefa'
            examples:
              independente:
                value:
                  titulo: Notas pessoais
              associada:
                value:
                  titulo: Preparar dados
                  projetoId: 00000000-0000-4000-8000-000000000011
                  prioridade: Alta
                  prazo: '2026-11-19'
      x-implementation-status: planned
  /tarefas/{tarefaId}:
    parameters:
    - $ref: '#/components/parameters/TarefaId'
    get:
      operationId: consultarTarefa
      summary: Consultar tarefa
      description: Acesso atual ao projeto ou criador se independente. Leitura autorizada de arquivadas
        e permitida.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-implementation-status: implemented
    patch:
      operationId: atualizarTarefa
      summary: Editar tarefa, estado e associacao
      description: Verificar acesso a origem e destino. Criador imutavel. projetoId=null torna privada
        do criador original; ator diferente pode perder acesso apos a operacao. Remover atribuicoes inelegiveis
        na mesma transacao. Bloquear qualquer alteracao se origem ou destino estiver arquivado. Transicoes
        de estado livres.
      responses:
        '200':
          description: Atualizacao concluida. Corpo JSON null se o ator perdeu acesso devido a desassociacao;
            caso contrario, DTO da tarefa autorizada. Interface remove da sua lista quando null.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Tarefa'
                - type: 'null'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarTarefa'
      x-implementation-status: planned
    delete:
      operationId: eliminarTarefa
      summary: Eliminar tarefa e dependentes
      description: Proprietario/colaboradores do projeto ou criador de independente. Confirmacao na UI.
        Arquivada bloqueia. Remover comentarios e atribuicoes atomicamente.
      responses:
        '204':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      x-implementation-status: planned
  /tarefas/{tarefaId}/utilizadores-elegiveis:
    parameters:
    - $ref: '#/components/parameters/TarefaId'
    get:
      operationId: listarElegiveis
      summary: Listar responsaveis elegiveis
      description: Exige acesso a tarefa. Proprietario e colaboradores atuais do projeto; so o criador
        para independente. Nunca devolver hashes.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Utilizador'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-implementation-status: planned
  /tarefas/{tarefaId}/responsaveis:
    parameters:
    - $ref: '#/components/parameters/TarefaId'
    get:
      operationId: listarResponsaveis
      summary: Consultar responsaveis
      description: Exige acesso a tarefa; nao concede acesso por mera atribuicao.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Responsavel'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-implementation-status: implemented
    post:
      operationId: atribuirResponsavel
      summary: Associar responsavel elegivel
      description: Verificar utilizador, elegibilidade e par unico. Arquivo bloqueia. Duplicado=409.
      responses:
        '201':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Responsavel'
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsavelRequest'
      x-implementation-status: planned
  /tarefas/{tarefaId}/responsaveis/{utilizadorId}:
    parameters:
    - $ref: '#/components/parameters/TarefaId'
    - $ref: '#/components/parameters/UtilizadorId'
    delete:
      operationId: removerResponsavel
      summary: Remover atribuicao
      description: Exige acesso a tarefa e nao arquivada. Remove apenas o par, sem apagar conta/tarefa.
      responses:
        '204':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      x-implementation-status: planned
  /tarefas/{tarefaId}/comentarios:
    parameters:
    - $ref: '#/components/parameters/TarefaId'
    get:
      operationId: listarComentarios
      summary: Consultar comentarios
      description: Exige acesso atual a tarefa, incluindo se arquivada em leitura.
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comentario'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-implementation-status: implemented
    post:
      operationId: adicionarComentario
      summary: Adicionar comentario
      description: Conteudo nao vazio/somente espacos; autor e instante definidos pelo backend. Nao aceitar
        autorId/criadoEm no pedido. Arquivo bloqueia.
      responses:
        '201':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comentario'
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioRequest'
      x-implementation-status: planned
  /painel:
    get:
      operationId: consultarPainel
      summary: Consultar painel inicial
      description: 'Proposta explicita: projetos acessiveis nao arquivados e contagens de tarefas desses
        projetos; parametro incluirIndependentes escolhe incluir tarefas pessoais. Nunca inclui arquivados,
        dados alheios ou apenas a pagina visivel. Politica de contagem para revisao.'
      responses:
        '200':
          description: Operacao concluida e, se altera dados, gravacao confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Painel'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: incluirIndependentes
        in: query
        required: true
        description: Escolha explicita do conjunto; sem valor assumido.
        schema:
          type: boolean
      x-implementation-status: planned
components:
  securitySchemes:
    Sessao:
      type: apiKey
      in: cookie
      name: matriz_session
      description: Sessão em memória no servidor, por cookie HttpOnly/SameSite=Lax; Secure no perfil HTTPS.
        Expira após 60 minutos de inatividade, logout ou reinício do backend. Sem JWT ou lembrar-me. Identificador
        rodado no login; cookie sem Max-Age persistente.
  parameters:
    ProjetoId:
      name: projetoId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TarefaId:
      name: tarefaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UtilizadorId:
      name: utilizadorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token obtido em GET /sessao/csrf e associado a sessao, inclusive antes do login.
      schema:
        type: string
        minLength: 1
  schemas:
    Id:
      type: string
      minLength: 1
      description: UUID concretizado na persistência no Exercício 2; string opaca para o cliente. Receber
        e reenviar IDs devolvidos pelo servidor, sem os construir. Formato inválido devolve 400.
      format: uuid
    Texto:
      type: string
      minLength: 1
      pattern: \S
    TextoOpcional:
      type:
      - string
      - 'null'
    Estado:
      type: string
      enum:
      - Por Fazer
      - Em Curso
      - Em Revisão
      - Concluída
    Prioridade:
      type: string
      enum:
      - Baixa
      - Média
      - Alta
      - Crítica
    Utilizador:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          $ref: '#/components/schemas/Texto'
        email:
          type: string
          format: email
      required:
      - id
      - nome
      - email
    Credenciais:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        palavraPasse:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - email
      - palavraPasse
    Csrf:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    Progresso:
      type: object
      additionalProperties: false
      properties:
        totalTarefas:
          type: integer
          minimum: 0
        tarefasConcluidas:
          type: integer
          minimum: 0
        percentagem:
          type: number
          minimum: 0
          maximum: 100
          description: Concluidas/total*100 arredondado a uma casa decimal; sem tarefas=0.
      required:
      - totalTarefas
      - tarefasConcluidas
      - percentagem
    CriarProjeto:
      type: object
      additionalProperties: false
      properties:
        nome:
          $ref: '#/components/schemas/Texto'
        descricao:
          $ref: '#/components/schemas/TextoOpcional'
      required:
      - nome
    AtualizarProjeto:
      type: object
      additionalProperties: false
      properties:
        nome:
          $ref: '#/components/schemas/Texto'
        descricao:
          $ref: '#/components/schemas/TextoOpcional'
        arquivado:
          type: boolean
      minProperties: 1
    ColaboradorRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResponsavelRequest:
      type: object
      additionalProperties: false
      properties:
        utilizadorId:
          $ref: '#/components/schemas/Id'
      required:
      - utilizadorId
    ComentarioRequest:
      type: object
      additionalProperties: false
      properties:
        conteudo:
          $ref: '#/components/schemas/Texto'
      required:
      - conteudo
    Problema:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        codigo:
          type: string
        detail:
          type: string
        erros:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              campo:
                type: string
              mensagem:
                type: string
            required:
            - campo
            - mensagem
      required:
      - type
      - title
      - status
      - codigo
    CriarTarefa:
      type: object
      additionalProperties: false
      properties:
        titulo:
          $ref: '#/components/schemas/Texto'
        descricao:
          $ref: '#/components/schemas/TextoOpcional'
        estado:
          $ref: '#/components/schemas/Estado'
          default: Por Fazer
        prioridade:
          anyOf:
          - $ref: '#/components/schemas/Prioridade'
          - type: 'null'
        prazo:
          type:
          - string
          - 'null'
          format: date
        projetoId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - titulo
    AtualizarTarefa:
      type: object
      additionalProperties: false
      properties:
        titulo:
          $ref: '#/components/schemas/Texto'
        descricao:
          $ref: '#/components/schemas/TextoOpcional'
        estado:
          $ref: '#/components/schemas/Estado'
        prioridade:
          anyOf:
          - $ref: '#/components/schemas/Prioridade'
          - type: 'null'
        prazo:
          type:
          - string
          - 'null'
          format: date
        projetoId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      minProperties: 1
    Projeto:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          $ref: '#/components/schemas/Texto'
        descricao:
          $ref: '#/components/schemas/TextoOpcional'
        arquivado:
          type: boolean
        proprietario:
          $ref: '#/components/schemas/Utilizador'
        progresso:
          $ref: '#/components/schemas/Progresso'
      required:
      - id
      - nome
      - descricao
      - arquivado
      - proprietario
      - progresso
    Tarefa:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        titulo:
          $ref: '#/components/schemas/Texto'
        descricao:
          $ref: '#/components/schemas/TextoOpcional'
        estado:
          $ref: '#/components/schemas/Estado'
        prioridade:
          anyOf:
          - $ref: '#/components/schemas/Prioridade'
          - type: 'null'
        prazo:
          type:
          - string
          - 'null'
          format: date
        projetoId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        criadorId:
          $ref: '#/components/schemas/Id'
      required:
      - id
      - titulo
      - descricao
      - estado
      - prioridade
      - prazo
      - projetoId
      - criadorId
    Comentario:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conteudo:
          $ref: '#/components/schemas/Texto'
        autor:
          $ref: '#/components/schemas/Utilizador'
        criadoEm:
          type: string
          format: date-time
      required:
      - id
      - conteudo
      - autor
      - criadoEm
    Responsavel:
      type: object
      additionalProperties: false
      properties:
        utilizador:
          $ref: '#/components/schemas/Utilizador'
      required:
      - utilizador
    ContagensEstado:
      type: object
      additionalProperties: false
      properties:
        Por Fazer:
          type: integer
          minimum: 0
        Em Curso:
          type: integer
          minimum: 0
        Em Revisão:
          type: integer
          minimum: 0
        Concluída:
          type: integer
          minimum: 0
      required:
      - Por Fazer
      - Em Curso
      - Em Revisão
      - Concluída
    Painel:
      type: object
      additionalProperties: false
      properties:
        utilizador:
          $ref: '#/components/schemas/Utilizador'
        projetos:
          type: array
          items:
            $ref: '#/components/schemas/Projeto'
        contagens:
          $ref: '#/components/schemas/ContagensEstado'
        incluiIndependentes:
          type: boolean
      required:
      - utilizador
      - projetos
      - contagens
      - incluiIndependentes
  responses:
    '400':
      description: JSON malformado ou parametros invalidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: JSON malformado ou parametros invalidos
            status: 400
            codigo: PEDIDO_INVALIDO
    '401':
      description: Sessao ausente/invalida ou credenciais invalidas.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Sessao ausente/invalida ou credenciais invalidas
            status: 401
            codigo: NAO_AUTENTICADO
    '403':
      description: Sem permissao para o recurso ou protecao CSRF/origem invalida. Nao devolver dados alheios.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Sem permissao para o recurso ou protecao CSRF/origem invalida
            status: 403
            codigo: ACESSO_NEGADO
    '404':
      description: Recurso/referencia inexistente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Recurso/referencia inexistente
            status: 404
            codigo: NAO_ENCONTRADO
    '409':
      description: Projeto arquivado, atribuicao duplicada ou conflito de integridade.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Projeto arquivado, atribuicao duplicada ou conflito de integridade
            status: 409
            codigo: CONFLITO
    '422':
      description: Dados do corpo invalidos; sem alteracoes parciais.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Dados do corpo invalidos; sem alteracoes parciais
            status: 422
            codigo: VALIDACAO
    '500':
      description: Falha interna/de gravacao; nao expor detalhes internos nem confirmar alteracoes parciais.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Falha interna/de gravacao; nao expor detalhes internos nem confirmar alteracoes parciais
            status: 500
            codigo: ERRO_INTERNO
servers:
- url: /api
  description: API da mesma origem; desenvolvimento com proxy Vite.
