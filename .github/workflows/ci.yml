name: Matriz CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matriz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes, build e Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: matriz-ci-${{ github.run_id }}
      APP_PORT: '18085'
      DB_PORT: '55435'
      APP_ALLOWED_ORIGINS: http://127.0.0.1:18085
      MATRIZ_BASE_URL: http://127.0.0.1:18085
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Instalar dependências frontend
        run: npm --prefix frontend ci
      - name: Análise estática
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Testes e build backend (PostgreSQL Testcontainers)
        run: sh backend/mvnw -B -ntp -f backend/pom.xml verify
      - name: Instalar dependências E2E
        run: npm --prefix e2e ci
      - name: Preparar Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Preparar configuração fictícia
        shell: bash
        run: |
          cp .env.example .env
          # Apenas configuração de demonstração; não usar secrets de produção.
          DEMO_PASSWORD=$(sed -n 's/^DEMO_PASSWORD=//p' .env)
          echo "::add-mask::$DEMO_PASSWORD"
          echo "DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          docker compose config --quiet
      - name: Construir imagens (apenas após testes aprovados)
        run: docker compose build app seed
      - name: Arrancar BD e seed explícito
        run: |
          docker compose up -d db --wait
          docker compose --profile tools run --rm seed
          docker compose up -d app --wait
      - name: E2E e segurança (suite normal)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/e2e-normal.json
        run: npm --prefix e2e test -- --reporter=json
      - name: Reinícios isolados
        working-directory: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/e2e-restarts.json
          MATRIZ_RESTART_TEST: '1'
          MATRIZ_TASK_RESTART_TEST: '1'
          MATRIZ_COLLAB_RESTART_TEST: '1'
        run: node node_modules/@playwright/test/cli.js test --grep '@restart|@task-restart|@collaboration-restart' --reporter=json
      - name: Resumo sem dados sensíveis
        if: always()
        run: python3 scripts/ci-summary.py
      - name: Publicar resumo de verificações
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}
          path: artifacts/ci-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Limpar containers e rede
        if: always()
        run: docker compose down --remove-orphans
